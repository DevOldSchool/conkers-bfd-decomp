name: Tooling or build issue
description: Report a reproducible problem with the supported contributor flow.
title: "Tooling: "
labels: [tooling]
body:
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: Include the command, OS/CPU, Docker version, and full non-sensitive error output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
