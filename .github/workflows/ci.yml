name: Public checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  metadata-and-tooling:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate repository metadata
        run: |
          python3 scripts/project_state.py validate
          ./conker progress check
          git -c core.whitespace=cr-at-eol diff --check
          bash -n conker scripts/conker.sh
      - name: Test project tooling
        run: python3 -m unittest discover -s tests -v
      - name: Build the public toolchain image
        run: |
          docker build --platform linux/amd64 --tag conkers-bfd-decomp-toolchain:ci .
          CONKER_IMAGE=conkers-bfd-decomp-toolchain:ci ./conker doctor
