name: PR validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: public-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  metadata:
    name: Repository metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate function inventory and source-unit contracts
        run: python3 scripts/project_state.py validate

  progress:
    name: Generated progress consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check generated reports against authoritative inventories
        run: ./conker progress check

  hygiene:
    name: PR whitespace and prohibited files
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check committed changes and reject ROM or generated inputs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-list --max-parents=0 HEAD)"
          fi
          python3 scripts/ci_checks.py hygiene --base "$BASE_SHA"

  tooling:
    name: Python tests and shell syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install public test dependencies
        run: python3 -m pip install PyYAML
      - name: Check shell entry points
        run: bash -n conker scripts/conker.sh
      - name: Run tooling and CI security regression tests
        run: python3 -m unittest discover -s tests -v

  toolchain:
    name: Toolchain image and compiler smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build the public toolchain image
        run: docker build --platform linux/amd64 --tag conkers-bfd-decomp-toolchain:ci .
      - name: Verify IDO and debugger installations
        run: CONKER_IMAGE=conkers-bfd-decomp-toolchain:ci ./conker doctor

  compile:
    name: US C compilation (no ROM)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compile active C with the pinned IDO image
        run: |
          image="$(python3 -c 'import json; x=json.load(open("toolchain/tools.lock.json"))["container_image"]; print(x["repository"]+"@"+x["digest"])')"
          docker pull "$image"
          mkdir -p build/ci-compile
          git ls-files -z -- src/ > build/ci-compile/sources.list
          docker run --rm --platform linux/amd64 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 256 \
            --user "$(id -u):$(id -g)" --tmpfs /tmp:rw,nosuid,nodev,size=512m \
            --tmpfs /workspace:rw,nosuid,nodev,size=16m,mode=1777 \
            --mount "type=bind,source=$PWD/src,target=/workspace/src,readonly" \
            --mount "type=bind,source=$PWD/include,target=/workspace/include,readonly" \
            --mount "type=bind,source=$PWD/scripts,target=/workspace/scripts,readonly" \
            --mount "type=bind,source=$PWD/build/ci-compile,target=/workspace/build/ci-compile" \
            --workdir /workspace "$image" python3 scripts/ci_checks.py compile --source-list build/ci-compile/sources.list

  workflows:
    name: GitHub workflow syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install checksum-pinned actionlint
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
      - name: Validate public workflows and private deployment template
        run: '"$RUNNER_TEMP/actionlint" -shellcheck= .github/workflows/*.yml ci/private-verifier/verify-pr.yml'

  required:
    name: All public PR checks passed
    if: always()
    needs: [metadata, progress, hygiene, tooling, toolchain, compile, workflows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every public check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert all(job['result'] == 'success' for job in results.values()), results
          PYTHON
