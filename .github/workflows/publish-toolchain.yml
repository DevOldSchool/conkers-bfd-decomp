name: Publish toolchain

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - toolchain/mupen64plus-debug.sh
      - toolchain/tools.lock.json
      - .github/workflows/publish-toolchain.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish reviewed toolchain and record immutable digest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize image repository
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          owner_lc="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "repository=ghcr.io/$owner_lc/conkers-bfd-decomp-toolchain" >> "$GITHUB_OUTPUT"
      - name: Build and publish public CPU toolchain
        id: published
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.repository }}:latest
            ${{ steps.image.outputs.repository }}:${{ github.sha }}
      - name: Record the registry manifest digest for future pin updates
        env:
          IMAGE: ${{ steps.image.outputs.repository }}
          DIGEST: ${{ steps.published.outputs.digest }}
        run: |
          printf 'Published immutable toolchain: `%s@%s`\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          printf 'Use this registry manifest digest in tools.lock.json; do not assume a local docker image ID is retrievable from the registry.\n' >> "$GITHUB_STEP_SUMMARY"
