name: Post-merge US verification and progress

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer main push supersedes earlier runs: it cancels one still queued,
# waiting for the environment approval or already building, so a burst of
# merges verifies and reports only its newest commit instead of serialising
# every merge behind the previous run and its approval.
concurrency:
  group: protected-rom-verification
  cancel-in-progress: true

jobs:
  verify-main:
    name: Approved main — US build and decomp.dev report
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: rom-verification
    env:
      CONKER_IMAGE: conkers-bfd-decomp-toolchain:verify
    steps:
      # Only main runs may receive ROM access. Pin the checkout to the event
      # commit so decomp.dev attributes the report to the code actually built.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false
      - name: Check private input configuration
        env:
          ROM_REPOSITORY: ${{ secrets.ROM_ASSETS_REPOSITORY }}
        run: |
          if [[ -z "$ROM_REPOSITORY" ]]; then
            echo "::error::Set ROM_ASSETS_REPOSITORY in the rom-verification environment."
            exit 1
          fi
      # Pull the pinned public image when the lock records it as built from
      # this checkout's toolchain inputs; otherwise (inputs changed, lock has no
      # inputs hash, or the registry is unavailable) build it locally as before.
      - name: Pull or build the public toolchain before fetching private inputs
        run: |
          published="$(python3 scripts/toolchain_inputs.py image)"
          if ./conker toolchain-inputs-check \
              && docker pull --platform linux/amd64 "$published"; then
            docker tag "$(docker image inspect --format '{{.Id}}' "$published")" "$CONKER_IMAGE"
            echo "toolchain: pulled the published image $published as $CONKER_IMAGE"
          else
            echo "toolchain: building the image locally from this checkout"
            docker build --platform linux/amd64 --tag "$CONKER_IMAGE" .
          fi
      - name: Fetch maintainer-owned ROM assets
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ secrets.ROM_ASSETS_REPOSITORY }}
          token: ${{ secrets.ROM_ASSETS_READ_TOKEN }}
          path: .private-rom-assets
          sparse-checkout: baserom.us.z64
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Build and verify active US target
        run: |
          ./conker setup --us .private-rom-assets/baserom.us.z64
          ./conker build --all --assets
      - name: Generate and validate US objdiff report
        run: ./conker objdiff report
      - name: Upload US progress for decomp.dev
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: us_report
          path: build/us/objdiff-report/report.json
          if-no-files-found: error
          retention-days: 90
      - name: Stop the toolchain and remove private inputs
        if: always()
        run: |
          ./conker stop || true
          rm -rf -- .private-rom-assets roms/baserom.us.z64
