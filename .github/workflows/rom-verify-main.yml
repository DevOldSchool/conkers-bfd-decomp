name: Post-merge US verification and progress

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protected-rom-verification
  cancel-in-progress: false

jobs:
  verify-main:
    name: Approved main — US build and decomp.dev report
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: rom-verification
    env:
      CONKER_IMAGE: conkers-bfd-decomp-toolchain:verify
    steps:
      # Only main runs may receive ROM access. Pin the checkout to the event
      # commit so decomp.dev attributes the report to the code actually built.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false
      - name: Fetch maintainer-owned ROM assets
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: DevOldSchool/conkers-bfd-assets
          token: ${{ secrets.ROM_ASSETS_READ_TOKEN }}
          path: .private-rom-assets
          sparse-checkout: baserom.us.z64
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Build and verify active US target
        run: |
          docker build --platform linux/amd64 --tag "$CONKER_IMAGE" .
          ./conker setup --us .private-rom-assets/baserom.us.z64
          ./conker build --all
      - name: Generate and validate US objdiff report
        run: ./conker objdiff report
      - name: Upload US progress for decomp.dev
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: us_report
          path: build/us/objdiff-report/report.json
          if-no-files-found: error
          retention-days: 90
      - name: Remove private ROM checkout
        if: always()
        run: rm -rf .private-rom-assets
