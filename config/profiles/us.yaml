options:
  basename: conker.us
  target_path: "__ROM_PATH__"
  elf_path: build/us/conker.us.elf
  base_path: ../..
  platform: n64
  compiler: IDO
  asm_path: asm/us
  src_path: src
  build_path: build/us
  ld_script_path: build/us/conker.us.ld
